<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixPath</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310a98d'/%3E%3Cpath d='M8 23 L16 9 L24 23' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Theme before first paint: light unless the user picked dark.
    try { document.documentElement.dataset.theme = localStorage.getItem("pixpath.theme") || "light"; } catch {}
  </script>
</head>
<body>
  <div class="win" id="win">
    <header class="chrome">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M8 23 L16 9 L24 23" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16" cy="9" r="2.6" fill="var(--accent-ink)"/></svg>
        PixPath
      </div>
      <nav class="menus" id="menus" aria-label="Menu"></nav>
      <div class="spacer"></div>
      <span class="status" id="status" aria-live="polite"></span>
      <div class="update" id="update" role="status">
        <span id="updateText"></span>
        <button class="btn primary small" id="updateInstall">Install &amp; restart</button>
        <button class="btn small" id="updateLater">Later</button>
      </div>
      <span class="ver" id="version"></span>
    </header>

    <div class="batchbar" id="batchbar" hidden></div>
    <div class="stepper" id="stepper" hidden></div>

    <div class="main">
      <section class="stage" id="stage" aria-label="Picture"></section>
      <section class="panel" id="panel" aria-label="Settings"></section>
    </div>

    <footer class="foot" id="foot"></footer>
  </div>

  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="folder" type="file" webkitdirectory multiple hidden>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dlg"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
