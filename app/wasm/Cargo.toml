[package]
name = "btrace-wasm"
description = "WebAssembly core for the Btrace app: an interactive tracing session."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Built with wasm-pack (`--target web`), not part of the core workspace.
# The app decodes images in the browser and hands over raw RGBA, so no image
# codecs are compiled in.

[lib]
crate-type = ["cdylib"]

[dependencies]
vtracer = { path = "../../crates/vtracer" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
