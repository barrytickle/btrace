<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a desktop app window (menu + stepper on top, picture left, decisions right, Back/Next at the bottom) that stacks on phones. */
:root {
  --bg: #eef3f1;          /* page ground, faint green-grey */
  --win: #fbfdfc;         /* app window */
  --panel: #ffffff;
  --sunk: #f2f6f4;        /* wells, tip boxes */
  --line: #dbe5e1;
  --line-2: #c7d4cf;
  --ink: #15211f;
  --ink-2: #4c5d59;
  --ink-3: #82918d;
  --accent: #10a98d;      /* forma green */
  --accent-ink: #ffffff;
  --accent-soft: #dff4ee;
  --amber: #c98a12;
  --amber-soft: #fbf0d6;
  --checker-a: #eef2f1;
  --checker-b: #ffffff;
  --shadow: 0 1px 2px rgba(21,33,31,.06), 0 8px 28px rgba(21,33,31,.08);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --win: #121b1a; --panel: #172221; --sunk: #1c2927; --line: #26332f; --line-2: #33433f;
    --ink: #e6efec; --ink-2: #a7b7b2; --ink-3: #71837e; --accent: #2cc9a8; --accent-ink: #062920; --accent-soft: #163a33;
    --amber: #e7b04a; --amber-soft: #3a2f17; --checker-a: #1f2b29; --checker-b: #172221;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413; --win: #121b1a; --panel: #172221; --sunk: #1c2927; --line: #26332f; --line-2: #33433f;
  --ink: #e6efec; --ink-2: #a7b7b2; --ink-3: #71837e; --accent: #2cc9a8; --accent-ink: #062920; --accent-soft: #163a33;
  --amber: #e7b04a; --amber-soft: #3a2f17; --checker-a: #1f2b29; --checker-b: #172221;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); padding-inline: 16px; padding-block: 20px 32px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.intro { max-width: 1180px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; color: var(--ink-2); }
.intro strong { color: var(--ink); font-family: var(--display); font-size: 17px; }
.intro .jump { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.intro .jump button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.intro .jump button:hover { color: var(--ink); border-color: var(--ink-3); }

/* ---- window ---- */
.win { max-width: 1180px; margin: 0 auto; background: var(--win); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto auto 1fr auto; min-height: 680px; }
.chrome { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; }
.menus { display: flex; gap: 2px; position: relative; }
.menus > div { position: relative; }
.menus > div > button { background: none; border: 0; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.menus > div > button:hover, .menus > div.open > button { background: var(--sunk); color: var(--ink); }
.drop { display: none; position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px; min-width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.menus > div.open .drop { display: grid; }
.drop button { display: flex; justify-content: space-between; gap: 20px; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.drop button:hover { background: var(--sunk); }
.drop kbd { font: 12px var(--mono); color: var(--ink-3); }
.drop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.chrome .spacer { flex: 1; }
.ver { font: 12px var(--mono); color: var(--ink-3); }
.update { display: none; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; }
.update.show { display: flex; }

.stepper { display: flex; gap: 6px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.stepper[hidden] { display: none; }
.st { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 999px; white-space: nowrap; color: var(--ink-3); font-size: 14px; border: 0; background: none; cursor: pointer; }
.st .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; background: var(--sunk); border: 1px solid var(--line-2); }
.st.on { color: var(--ink); font-weight: 600; }
.st.on .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.st.done .n { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.st.skip { text-decoration: line-through; opacity: .6; cursor: default; }
.st + .sep { width: 18px; height: 1px; background: var(--line-2); flex: 0 0 auto; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.stage { position: relative; padding: 18px; display: grid; place-items: center; border-right: 1px solid var(--line); min-width: 0; }
.panel { padding: 22px; display: grid; align-content: start; gap: 16px; min-width: 0; overflow-y: auto; }
.foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.foot .spacer { flex: 1; }
.foot .note { color: var(--ink-3); font-size: 13px; }

h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.sub { color: var(--ink-2); margin: -8px 0 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn[disabled] { opacity: .45; cursor: default; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; }

/* ---- picture area ---- */
.canvas {
  position: relative; width: min(100%, 560px); aspect-ratio: 13 / 10; border-radius: 12px; overflow: hidden;
  background-color: var(--checker-b);
  background-image: linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%), linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%);
  background-size: 18px 18px; background-position: 0 0, 9px 9px; border: 1px solid var(--line);
}
.canvas img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.canvas .after { clip-path: inset(0 0 0 50%); }
.canvas .split { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--accent); }
.canvas .split::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.canvas .tag { position: absolute; top: 10px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); }
.canvas .tag.l { left: 10px; } .canvas .tag.r { right: 10px; }
.canvas .hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.canvas svg.bounds { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.zoombar { position: absolute; left: 30px; bottom: 30px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; font-size: 13px; }
.zoombar span, .zoombar button { padding: 2px 8px; border: 0; background: none; color: var(--ink-2); }
.analysing { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--win) 55%, transparent); font-weight: 600; }

/* ---- start screen ---- */
.dropzone { width: min(100%, 560px); aspect-ratio: 13 / 10; border: 2px dashed var(--line-2); border-radius: 18px; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-3); transition: border-color .15s, background .15s; }
.dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
.dropzone svg { width: 74px; height: 74px; }
.dropzone .big { font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--ink-2); line-height: 1.2; margin-top: 12px; }
.dropzone .small { margin-top: 8px; font-size: 14px; }
.dropzone .demo { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.action { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
.action:hover { border-color: var(--accent); }
.action .ic { width: 76px; height: 64px; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; }
.action .ic svg { width: 40px; height: 40px; }
.action strong { display: block; font-size: 16px; }
.action span { color: var(--ink-2); font-size: 13px; }
.action kbd { font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }
.recent { display: grid; gap: 4px; }
.recent button { display: flex; justify-content: space-between; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; color: var(--ink-2); font-size: 14px; }
.recent button:hover { background: var(--sunk); color: var(--ink); }
.recent em { font-style: normal; color: var(--ink-3); font-size: 12px; }

/* ---- findings + choices ---- */
.findings { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }
.mode { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; }
.mode:hover { border-color: var(--ink-3); }
.mode strong { font-size: 17px; }
.mode p { grid-column: 1 / -1; margin: 0; color: var(--ink-2); font-size: 14px; }
.rec { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; align-self: center; white-space: nowrap; }

.why { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--ink); }
.why svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 1px; color: var(--accent); }
.tip { display: flex; gap: 10px; background: var(--sunk); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { position: relative; display: grid; gap: 6px; text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; cursor: pointer; }
.opt:hover { border-color: var(--ink-3); }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.opt .pv { aspect-ratio: 4 / 3; border-radius: 9px; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.opt .pv img, .opt .pv svg { width: 100%; height: 100%; object-fit: contain; }
.opt .pv.checker { background-color: var(--checker-b); background-image: linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%), linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%); background-size: 12px 12px; background-position: 0 0, 6px 6px; }
.opt strong { font-size: 15px; }
.opt span { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.opt .rec { position: absolute; top: 8px; right: 8px; }
.opt .tick { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: none; place-items: center; }
.opt.on .tick { display: grid; }
.opts.three { grid-template-columns: repeat(3, 1fr); }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; text-align: left; width: 100%; }
.toggle .t strong { display: block; font-size: 15px; }
.toggle .t span { font-size: 13px; color: var(--ink-2); }
.sw { flex: 0 0 auto; width: 40px; height: 23px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle.on .sw { background: var(--accent); }
.toggle.on .sw::after { left: 20px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches i { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(0,0,0,.08); }

/* "What forma did" */
.did { display: grid; gap: 8px; }
.did .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.did .row.off { opacity: .55; }
.did .row .ok { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.did .row.off .ok { background: var(--sunk); color: var(--ink-3); }
.did .row b { font-weight: 600; }
.did .row small { display: block; color: var(--ink-3); font-size: 12.5px; }
.did .row button { font-size: 13px; }

/* advanced */
.adv { display: grid; gap: 14px; }
.adv section { display: grid; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.adv label.r { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; }
.adv output { font: 13px var(--mono); color: var(--ink-2); }
.adv input[type=range] { width: 100%; accent-color: var(--accent); }
.adv p { margin: 0; font-size: 12.5px; color: var(--ink-3); }

/* batch */
.batchlist { width: min(100%, 600px); display: grid; gap: 8px; }
.bfile { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 8px 8px; }
.bfile .th { width: 56px; height: 44px; border-radius: 7px; overflow: hidden; background: var(--sunk); }
.bfile .th img { width: 100%; height: 100%; object-fit: contain; }
.bfile b { font-weight: 600; font-size: 14px; }
.bfile small { display: block; color: var(--ink-3); font-size: 12.5px; }
.state { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink-3); white-space: nowrap; }
.state.done { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.state.run { background: var(--amber-soft); color: var(--amber); font-weight: 600; }
.progress { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--win); padding: 9px 16px; border-radius: 999px; font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); }
  .menus { display: none; }
  .win { min-height: 0; }
}
@media (max-width: 480px) {
  .opts, .opts.three { grid-template-columns: 1fr 1fr; }
  .action { grid-template-columns: 56px 1fr; }
  .action .ic { width: 56px; height: 52px; }
  .dropzone .big { font-size: 21px; }
  .foot .note { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="intro">
  <strong>forma, clickable prototype</strong>
  <span>Images are simulated; nothing is really traced. Click through as a user would.</span>
  <div class="jump" aria-label="Jump to screen">
    <button data-go="start">Start</button>
    <button data-go="mode">Choose how</button>
    <button data-go="auto">Automatic</button>
    <button data-go="wizard">Guided</button>
    <button data-go="advanced">Advanced</button>
    <button data-go="batch">Batch</button>
  </div>
</div>

<div class="win" id="win">
  <div class="chrome">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M8 23 L16 9 L24 23" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16" cy="9" r="2.6" fill="var(--accent-ink)"/></svg>
      forma
    </div>
    <nav class="menus" aria-label="Menu">
      <div><button>File</button><div class="drop">

        <hr><button data-act="toast:Recent images would list here">Recent images ›</button>
        <hr><button data-act="save">Save SVG… <kbd>Ctrl+S</kbd></button>
        <button data-act="toast:Saves every SVG in the batch into a folder">Save all… <kbd>Ctrl+Shift+S</kbd></button>

      <div><button>Edit</button><div class="drop">
        <button data-act="toast:Undo: puts back the last change">Undo <kbd>Ctrl+Z</kbd></button>
        <button data-act="toast:Redo">Redo <kbd>Ctrl+Y</kbd></button>

      <div><button>View</button><div class="drop">

        <button data-act="bounds">Bounds <kbd>B</kbd></button>

        <hr><button data-act="toast:Opens a pre-filled GitHub issue">Report a problem</button>
        <button data-act="toast:forma 0.3.0 · based on visioncortex VTracer (MIT)">About forma</button>
      </div></div>
    </nav>
    <div class="spacer"></div>
    <div class="update" id="update">forma 0.3.1 is ready <button class="btn primary" style="padding:3px 10px;font-size:13px" data-act="toast:Downloading and restarting…">Install &amp; restart</button></div>
    <span class="ver">v0.3.0</span>
  </div>

  <div class="stepper" id="stepper" hidden></div>

  <div class="main">
    <div class="stage" id="stage"></div>
    <div class="panel" id="panel"></div>
  </div>

</div>

<script>
/* ---------------------------------------------------------------------------
   Sample artwork: forma's own "Summit" badge, drawn here so the prototype
   needs no third-party images. Variants stand in for real traces.
--------------------------------------------------------------------------- */
const C = { navy: "#1d2b53", teal: "#19a594", orange: "#f28c28", cream: "#f5e9d4", white: "#ffffff" };

function badge({ bg = true, colours = 4, trim = false, mono = false, shade = false } = {}) {
  // Canvas 260x200 with the badge centred: 30 px of empty space top/bottom, 60 at the sides.
  const vb = trim ? "60 30 140 140" : "0 0 260 200";
  let navy = C.navy, teal = C.teal, orange = C.orange, cream = C.cream;
  if (colours <= 3) teal = navy;          // teal merges into navy
  if (colours <= 2) cream = orange;       // cream merges into orange
  if (mono) navy = teal = orange = "#111", cream = "#fff";
  const grad = shade ? `<defs><radialGradient id="g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#34477c"/><stop offset="1" stop-color="${C.navy}"/></radialGradient></defs>` : "";
  const ring = shade ? "url(#g)" : navy;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${grad}
    ${bg ? `<rect width="260" height="200" fill="${C.white}"/>` : ""}
    <circle cx="130" cy="100" r="70" fill="${ring}"/>
    <circle cx="150" cy="78" r="17" fill="${orange}"/>
    <path d="M78 140 L118 82 L134 104 L148 88 L184 140 Z" fill="${teal}"/>
    <path d="M118 82 L106 99 L114 96 L120 103 L126 94 Z" fill="${cream}"/>
    <path d="M148 88 L141 97 L147 95 L152 100 Z" fill="${cream}"/>
    <rect x="78" y="140" width="106" height="10" rx="2" fill="${cream}"/>
  </svg>`;
}
const uri = (svg) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

// The "original": the badge rasterised small, then shown large, so it looks
// like a soft, low-resolution PNG next to the crisp trace.
let rasterURL = "";
function makeRaster(done) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement("canvas");
    cv.width = 104; cv.height = 80;
    const g = cv.getContext("2d");
    g.drawImage(img, 0, 0, 104, 80);
    rasterURL = cv.toDataURL("image/png");
    done();
  };
  img.src = uri(badge({ bg: true, colours: 5 }));
}

function current() {
  const bg = S.bg === "keep";
  return badge({
    bg,
    trim: S.trim && !bg,
    colours: S.type === "bw" ? 2 : S.colours,
    mono: S.type === "bw",

const $ = (s) => document.querySelector(s);
const icon = {

  spark: `<svg viewBox="0 0 20 20"><path d="M10 2l1.8 5.2L17 9l-5.2 1.8L10 16l-1.8-5.2L3 9l5.2-1.8z" fill="currentColor"/></svg>`,
};

function picture({ split = true, hint = "", analysing = false } = {}) {
  const after = uri(current());
  const bounds = S.bounds ? boundsOverlay() : "";
  return `<div class="canvas">
      <img src="${rasterURL}" alt="Original image" style="image-rendering:auto">
      ${split ? `<img class="after" src="${after}" alt="Traced vector">
      <div class="split" aria-hidden="true"></div>
      <span class="tag l">Original PNG</span><span class="tag r">forma SVG</span>` : ""}
      ${bounds}
      ${hint ? `<span class="hint">${hint}</span>` : ""}
      ${analysing ? `<div class="analysing">Analysing your image…</div>` : ""}
    </div>
    <div class="zoombar" aria-hidden="true"><button>−</button><span>216%</span><button>+</button></div>`;
}

function boundsOverlay() {
  // Hatch the empty space between the SVG's edge and the badge (viewBox 0 0 260 200).
  if (S.bg === "keep") return "";
  const trimmed = S.trim;
  return `<svg class="bounds" viewBox="0 0 260 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="rgba(201,138,18,.45)"/></pattern></defs>
    ${trimmed ? "" : `<path fill="url(#h)" fill-rule="evenodd" d="M0 0h260v200H0z M60 30h140v140H60z"/>`}
    <rect x="${trimmed ? 60 : 1}" y="${trimmed ? 30 : 1}" width="${trimmed ? 140 : 258}" height="${trimmed ? 140 : 198}" fill="none" stroke="#c98a12" stroke-width="1.5" stroke-dasharray="5 3"/>
  </svg>`;
}

function opt({ key, value, title, text, preview, checker = false, rec = false }) {
  const on = S[key] === value;
  return `<button class="opt${on ? " on" : ""}" data-set="${key}" data-val="${value}" aria-pressed="${on}">
      <span class="tick">${icon.check}</span>
      ${rec ? `<span class="rec">Recommended</span>` : ""}
      <span class="pv${checker ? " checker" : ""}">${preview}</span>
      <strong>${title}</strong><span>${text}</span>
    </button>`;
}

// Image-type illustrations: zoomed edges, the way they look up close.
function edgeArt(kind) {
  const cells = [];
  const n = 8;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const d = x - (n - 1 - y) * 0.9;           // signed distance to a diagonal edge
    let a;
    if (kind === "sharp") a = d > 0 ? 1 : 0;
    else if (kind === "soft") a = Math.min(1, Math.max(0, (d + 1.2) / 2.4));
    else if (kind === "photo") a = Math.min(1, Math.max(0, (d + 3) / 7)) * (0.75 + 0.25 * Math.sin(x * 1.7 + y));
    else a = d > 0 ? 1 : 0;
    if (a > 0.02) cells.push(`<rect x="${x * 10}" y="${y * 10}" width="10" height="10" fill="${kind === "bw" ? "#111" : C.navy}" fill-opacity="${a.toFixed(2)}"/>`);
  }
  return `<svg viewBox="0 0 80 80" aria-hidden="true" style="width:72%;height:72%">${cells.join("")}</svg>`;
}

/* ---------------------------------------------------------------------------
   Wiring
--------------------------------------------------------------------------- */
function render() { screens[S.screen](); }
function go(screen) {
  S.screen = screen;
  if (screen === "wizard") S.step = S.step || 1;
  if (screen === "batch") S.batchDone = 0;
  render();
  document.getElementById("win").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}
function openImage() {
  S.analysing = true;
  go("mode");
  setTimeout(() => { S.analysing = false; if (S.screen === "mode") render(); }, 900);
}

document.addEventListener("click", (e) => {
  const menuBtn = e.target.closest(".menus > div > button");
  document.querySelectorAll(".menus > div").forEach((d) => { if (!menuBtn || d !== menuBtn.parentElement) d.classList.remove("open"); });
  if (menuBtn) { menuBtn.parentElement.classList.toggle("open"); return; }

  const go_ = e.target.closest("[data-go]");
  if (go_) { const s = go_.dataset.go; if (s === "wizard") S.step = 1; go(s); return; }

  const set = e.target.closest("[data-set]");
  if (set) {
    const v = set.dataset.val;
    S[set.dataset.set] = isNaN(+v) ? v : +v;
    if (set.dataset.set === "bg" && v === "keep") S.trim = false;
    if (set.dataset.set === "bg" && v !== "keep" && !S.trimTouched) S.trim = true;
    render(); return;
  }
  const tog = e.target.closest("[data-toggle]");
  if (tog && !tog.disabled) {
    const k = tog.dataset.toggle;
    if (k === "bgRemove") S.bg = S.bg === "remove" ? "keep" : "remove";
    else { S[k] = !S[k]; if (k === "trim") S.trimTouched = true; }
    render(); return;
  }
  const undo = e.target.closest("[data-undo]");
  if (undo) {
    const k = undo.dataset.undo;
    S.autoUndo[k] = !S.autoUndo[k];
    if (k === "bg") S.bg = S.autoUndo.bg ? "keep" : "remove";
    if (k === "trim") S.trim = !S.autoUndo.trim;
    if (k === "colours") S.colours = S.autoUndo.colours ? 3 : 4;
    if (k === "lines") S.lines = !S.autoUndo.lines;
    render(); return;
  }
  const step = e.target.closest("[data-step]");
  if (step && S.screen === "wizard") { S.step = +step.dataset.step; render(); return; }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a.startsWith("toast:")) return toast(a.slice(6));
  ({
    open: openImage,
    paste: openImage,
    batch: () => go("batch"),
    start: () => go("start"),
    mode: () => go("mode"),
    auto: () => { Object.assign(S, RECOMMENDED, { autoUndo: {} }); go("auto"); },
    wizard: () => { S.step = 1; go("wizard"); },
    advanced: () => go("advanced"),
    next: () => { S.step = Math.min(5, S.step + 1); render(); },
    prev: () => { S.step = Math.max(1, S.step - 1); render(); },
    save: () => toast(S.screen === "start" ? "Open an image first" : "Save as: summit-badge.svg"),
    bounds: () => { S.bounds = !S.bounds; render(); },
    update: () => { $("#update").classList.add("show"); toast("forma 0.3.1 is available"); },
    theme: () => {
      const r = document.documentElement;
      const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      r.dataset.theme = dark ? "light" : "dark";
    },
  })[a]?.();
});

document.addEventListener("input", (e) => {
  const r = e.target.closest("[data-range]");
  if (r) {
    // Update the picture only, so the slider keeps the pointer mid-drag.
    S[r.dataset.range] = +r.value;
    r.previousElementSibling.querySelector("output").textContent = r.value;
    stage.innerHTML = picture({ hint: "Changes show instantly" });
    return;
  }
  if (e.target.type === "range") e.target.previousElementSibling.querySelector("output").textContent = e.target.value;
});

makeRaster(render);
</script>
